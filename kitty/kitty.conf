# Tema: Catppuccin Mocha (kovidgoyal/kitty-themes)
include themes/Catppuccin-Mocha.conf

# Font
font_family      MesloLGM Nerd Font Mono
font_size        12.0
disable_ligatures never

# Şeffaflık (KDE Wayland'de blur için KWin efektini açman gerekir)
background_opacity         0.65
dynamic_background_opacity yes
background_blur            8

# Kontrast: temanın foreground/background'unu daha belirgin yap
# foreground              #E6EBFF
# background              #11111B
# selection_foreground    #11111B
# selection_background    #F5C2E7
minimum_contrast        3.0
bold_is_bright          no

# Pencere
window_padding_width  10
hide_window_decorations yes
confirm_os_window_close 0

# İmleç
cursor_shape          beam
cursor_blink_interval 0

# Sekmeler
tab_bar_style         powerline
tab_powerline_style   round

# Kısayollar: opaklığı anlık ayarla
map ctrl+shift+a>m set_background_opacity +0.05
map ctrl+shift+a>l set_background_opacity -0.05
map ctrl+shift+a>1 set_background_opacity 1
map ctrl+shift+a>d set_background_opacity default


# BEGIN_KITTY_THEME
# Argonaut
include current-theme.conf
# END_KITTY_THEME